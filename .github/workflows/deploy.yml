name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      proxyip:
        description: 'Optional: Enter fallback Proxy IP(s) (comma-separated)'
        required: false
        default: ''
      uuid:
        description: 'Optional: Enter a specific UUID for this run'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Deploy via Wrangler Action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          vars: |
            UUID
            PROXYIP
        env:
          UUID: ${{ inputs.uuid || secrets.UUID || '' }}
          PROXYIP: ${{ inputs.proxyip || secrets.PROXYIP || '' }}
